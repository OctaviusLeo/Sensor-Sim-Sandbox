# Lidar_Model configuration (LidarConfig). Bounds enforced via the shared
# validation contract (FSensorBoundSet): any out-of-bound value is rejected, the
# offending parameter is named, and the last valid config is retained
# (Requirement 3.1, 3.2). These are the design's Gate A values
# (design.md "Gate A run configuration"): 16 channels x 360 deg at 1.0 deg
# angular resolution over a 30 deg vertical FOV = 5,760 rays per scan.
channels: 16                 # int, 1-128
h_fov_deg: 360.0             # float, (0, 360]
v_fov_deg: 30.0              # float, (0, 180]
angular_resolution_deg: 1.0  # float, 0.01-10.0
max_range_m: 100.0           # float, 0.1-1000.0
rate_hz: 10.0                # float, 0.1-100.0
range_noise_sigma_m: 0.02    # float, 0.0-10.0
dropout_prob: 0.10           # float, 0.0-1.0
latency_ms: 200              # int, 0-1000
