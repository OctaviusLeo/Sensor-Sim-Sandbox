# CI_Pipeline (design.md 'GitHub Actions'; Req 8.2).
#
# Runs on pushes to the default branch and on pull requests targeting it. Sets
# up Python 3.11, installs the package with its test extras, runs the full unit +
# property suite with coverage, and runs the GPU-free, API-key-free CI smoke
# subset driven by the deterministic Stub_Model. The job fails if any unit test
# fails or the smoke subset does not meet its deterministic expected outcomes.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with test extras
        run: python -m pip install -e ".[test]"

      - name: Run the unit + property test suite with coverage
        run: python -m pytest --cov=aib --cov-report=term-missing

      - name: Run the CI smoke subset (Stub_Model; no GPU, no API key)
        run: python scripts/ci_smoke.py
