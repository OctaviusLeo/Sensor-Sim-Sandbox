# Sensor Sim Sandbox — analysis pytest suite (Requirements 9.3, 9.4, 9.5).
# Unreal Automation tests need UE5 + a GPU and run locally via scripts/run_ue_tests.ps1.
name: ci-sensor-sim-sandbox

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Run pytest
        run: python -m pytest analysis/tests -q
